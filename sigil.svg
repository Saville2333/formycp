<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Cthulhu Table 印记">
  <defs>
    <radialGradient id="seal-bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#1b3529"/>
      <stop offset="58%" stop-color="#0d1c16"/>
      <stop offset="100%" stop-color="#07100d"/>
    </radialGradient>
    <linearGradient id="seal-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0c98f"/>
      <stop offset="45%" stop-color="#b89a5d"/>
      <stop offset="100%" stop-color="#7e6538"/>
    </linearGradient>
    <filter id="seal-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="97" fill="url(#seal-bg)" stroke="#3c3220" stroke-width="1"/>
  <circle cx="100" cy="100" r="89" fill="none" stroke="url(#seal-gold)" stroke-width="1.1" opacity=".85"/>
  <circle cx="100" cy="100" r="83.5" fill="none" stroke="#8e7442" stroke-width=".7" stroke-dasharray="1 5.2" opacity=".8"/>
  <circle cx="100" cy="100" r="72" fill="none" stroke="#8e7442" stroke-width=".65" opacity=".55"/>

  <!-- 外圈符文刻度 -->
  <g stroke="url(#seal-gold)" stroke-width="1.1" stroke-linecap="round" opacity=".9">
    <path d="M100 8v9M100 183v9M8 100h9M183 100h9"/>
    <path d="m35 35 6.5 6.5M158.5 158.5l6.5 6.5M165 35l-6.5 6.5M41.5 158.5 35 165" opacity=".6"/>
    <path d="M100 19v4M100 177v4" opacity=".6"/>
  </g>

  <!-- 八向封印短痕 -->
  <g stroke="#a78a54" stroke-width="1" stroke-linecap="round" opacity=".55">
    <g transform="rotate(22.5 100 100)"><path d="M100 21v7"/><circle cx="100" cy="33" r="1.3" fill="#a78a54" stroke="none"/></g>
    <g transform="rotate(67.5 100 100)"><path d="M100 21v7"/><circle cx="100" cy="33" r="1.3" fill="#a78a54" stroke="none"/></g>
    <g transform="rotate(112.5 100 100)"><path d="M100 21v7"/><circle cx="100" cy="33" r="1.3" fill="#a78a54" stroke="none"/></g>
    <g transform="rotate(157.5 100 100)"><path d="M100 21v7"/><circle cx="100" cy="33" r="1.3" fill="#a78a54" stroke="none"/></g>
    <g transform="rotate(202.5 100 100)"><path d="M100 21v7"/><circle cx="100" cy="33" r="1.3" fill="#a78a54" stroke="none"/></g>
    <g transform="rotate(247.5 100 100)"><path d="M100 21v7"/><circle cx="100" cy="33" r="1.3" fill="#a78a54" stroke="none"/></g>
    <g transform="rotate(292.5 100 100)"><path d="M100 21v7"/><circle cx="100" cy="33" r="1.3" fill="#a78a54" stroke="none"/></g>
    <g transform="rotate(337.5 100 100)"><path d="M100 21v7"/><circle cx="100" cy="33" r="1.3" fill="#a78a54" stroke="none"/></g>
  </g>

  <!-- 几何封印 -->
  <g fill="none" stroke="url(#seal-gold)" stroke-width="1" opacity=".45">
    <path d="M100 34 158 136H42Z"/>
    <path d="M100 50 144 127H56Z"/>
    <circle cx="100" cy="100" r="45" stroke-dasharray="2 4"/>
  </g>

  <!-- 中央之眼与触须 -->
  <g filter="url(#seal-glow)">
    <path d="M66 100c0-13 15-23 34-23s34 10 34 23c0 14-15 24-34 24s-34-10-34-24Z" fill="#0a1511" stroke="url(#seal-gold)" stroke-width="2"/>
    <ellipse cx="100" cy="100" rx="10.5" ry="15.5" fill="#a88a51"/>
    <ellipse cx="100" cy="100" rx="3.2" ry="12.4" fill="#08100d"/>
    <circle cx="96" cy="94" r="2.1" fill="#efe1bb" opacity=".85"/>
    <g fill="none" stroke="url(#seal-gold)" stroke-width="2.1" stroke-linecap="round">
      <path d="M82 121c-4 14 3 24 13 31"/>
      <path d="M91 124c-1 18 5 27 15 36"/>
      <path d="M100 124v39"/>
      <path d="M109 124c1 18-5 27-15 36"/>
      <path d="M118 121c4 14-3 24-13 31"/>
    </g>
    <g fill="none" stroke="#a78a54" stroke-width="1.2" stroke-linecap="round" opacity=".7">
      <path d="M76 112c-8 8-7 19 1 24"/>
      <path d="M124 112c8 8 7 19-1 24"/>
    </g>
  </g>

  <circle cx="100" cy="100" r="94" fill="none" stroke="#d4b87b" stroke-width=".5" opacity=".25"/>
</svg>
