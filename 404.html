<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#07100d">
  <title>404 · Cthulhu Table</title>
  <style>
    html, body { height: 100%; margin: 0; background: #07100d; color: #d9d2c1; }
    body {
      display: grid; place-items: center; padding: 24px;
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 50% 40%, #10231b 0%, #07100d 62%);
    }
    .card { max-width: 480px; padding: 34px; border: 1px solid rgba(185,154,91,.25); background: rgba(10,22,16,.75); text-align: center; }
    .mark { width: 76px; height: 76px; margin-bottom: 18px; }
    .kicker { margin: 0 0 8px; color: #b99a5b; font: 600 10px/1.4 Georgia, serif; letter-spacing: .24em; text-transform: uppercase; }
    h1 { margin: 0 0 12px; color: #eee4ce; font: 500 28px/1.35 "Noto Serif SC", "Songti SC", SimSun, serif; }
    p { margin: 0 0 22px; color: #8a9388; font-size: 13px; line-height: 1.9; }
    a { display: inline-flex; padding: 10px 18px; border: 1px solid rgba(185,154,91,.5); color: #dec58c; text-decoration: none; font-size: 12px; letter-spacing: .06em; }
    a:hover { background: rgba(185,154,91,.1); }
  </style>
</head>
<body>
  <main class="card">
    <img class="mark" src="assets/sigil.svg" alt="">
    <p class="kicker">404 · Lost in the Archives</p>
    <h1>这条走廊不在档案里</h1>
    <p>页面可能已被移动。你的本地战役仍然保存在浏览器中。正在把你带回战役总览……</p>
    <a id="home-link" href="./#/home">返回战役总览</a>
  </main>
  <script>
    // GitHub Pages 项目站点可能位于 /repo/ 子路径；按第一段路径回到项目根。
    (function () {
      var parts = window.location.pathname.split('/').filter(Boolean);
      var base = parts.length > 1 ? '/' + parts[0] + '/' : '/';
      var link = document.getElementById('home-link');
      link.href = base + '#/home';
      window.setTimeout(function () { window.location.replace(base + '#/home'); }, 700);
    })();
  </script>
</body>
</html>
